<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Japan Reiseplaner</title>
<meta name="theme-color" content="#d9472b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{color-scheme:light dark;--bg:#faf6f0;--card:#fff;--ink:#23284a;--mut:#6b6f8a;--line:#e8e1d6;--acc:#d9472b;--soft:#f3ece2;--blue:#1e6fd9;--ok:#2f9e6b;--warn:#d99a1d;--bad:#c43d52;--sh:0 4px 18px #2b3a6722;--r:16px}
@media(prefers-color-scheme:dark){:root{--bg:#14172b;--card:#1e2243;--ink:#eceefb;--mut:#9aa0c4;--line:#2d3358;--acc:#ff6a4d;--soft:#272c52;--blue:#6aa8ff;--sh:0 4px 18px #0007}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acc)}
.mut{color:var(--mut)}.sm{font-size:.82rem}
/* Kopfzeile */
#top{position:absolute;top:0;left:0;right:0;height:54px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--card);border-bottom:1px solid var(--line);z-index:30}
#brand{font-weight:800;font-size:1.05rem;white-space:nowrap}
#brand i{font-style:normal;color:var(--acc)}
#vs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;padding:4px 0}
#vs::-webkit-scrollbar{display:none}
.vc{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;white-space:nowrap;font-size:.85rem;font-weight:600}
.vc.on{background:var(--acc);border-color:var(--acc);color:#fff}
/* Aufbau */
#app{position:absolute;top:54px;bottom:0;left:0;right:0;display:grid;grid-template-columns:440px 1fr}
#panel{grid-column:1;grid-row:1;position:relative;z-index:50;display:flex;flex-direction:column;background:var(--bg);border-right:1px solid var(--line);min-height:0;z-index:20}
#mapwrap{grid-column:2;grid-row:1;position:relative;min-width:0;z-index:0;isolation:isolate}
#lmap{position:absolute;inset:0;background:#cfe3ee}
#handle{display:none}
#pbody{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch}
#bn{display:flex;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom)}
#bn button{flex:1;border:0;background:none;padding:8px 1px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.66rem;font-weight:600;color:var(--mut)}
#bn button b{font-size:1.25rem;line-height:1}
#bn button.on{color:var(--acc)}
@media(max-width:820px){
 #app{display:block}
 #mapwrap{position:absolute;inset:0;z-index:0}
 #panel{position:absolute;left:0;right:0;bottom:0;height:46%;border-right:0;border-radius:20px 20px 0 0;box-shadow:0 -6px 24px #0003;transition:height .25s ease}
 #panel.drag{transition:none}
 #handle{display:block;padding:9px 0 5px;touch-action:none;cursor:grab}
 #handle i{display:block;width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
 #brand span{display:none}
}
/* Karte */
#mc{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;z-index:500}
#mc button{width:40px;height:40px;border-radius:12px;border:0;background:var(--card);box-shadow:var(--sh);font-size:1.1rem;display:grid;place-items:center}
#mc button.on{background:var(--acc);color:#fff}
#rstat{position:absolute;left:10px;top:10px;z-index:500;max-width:calc(100% - 70px);background:var(--card);box-shadow:var(--sh);border-radius:10px;padding:5px 10px;font-size:.76rem;color:var(--mut)}
#rstat:empty{display:none}
.mkw{background:none;border:0}
.mk{position:relative;display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--c);border:3px solid #fff;box-shadow:0 2px 8px #0006;font-size:18px;transition:transform .15s}
.mk.act{transform:scale(1.3);box-shadow:0 0 0 4px #fff8,0 3px 12px #0008}
.mk b{position:absolute;top:-9px;right:-9px;min-width:19px;height:19px;padding:0 4px;border-radius:99px;background:#23284a;color:#fff;font-size:11px;display:grid;place-items:center;border:2px solid #fff}
.mkl{position:absolute;top:40px;left:50%;transform:translateX(-50%);white-space:nowrap;font:700 12px system-ui;color:#23284a;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 5px #fff;pointer-events:none}
.pp{width:28px;height:28px;border-radius:50%;background:#fff;border:2.5px solid var(--c,#1c8fb5);display:grid;place-items:center;font-size:14px;box-shadow:0 2px 6px #0005;position:relative}
.pp.dn{opacity:.5;filter:grayscale(.8)}
.pp.hb{border-color:var(--blue);box-shadow:0 0 0 3px #1e6fd955,0 2px 6px #0005}
.rl{display:inline-block;transform:translate(-50%,-50%);white-space:nowrap;font:700 11.5px system-ui;background:#fffe;color:#23284a;border-radius:99px;padding:2px 8px;box-shadow:0 1px 5px #0004;pointer-events:none}
.rl.hl{color:#1e6fd9}
.tip{max-width:230px}
.tip img{width:68px;height:68px;object-fit:cover;border-radius:8px;margin:2px}
.pop{font:13px/1.4 system-ui;min-width:170px}
.pop b{font-size:14px}
.pop a{color:#d9472b;font-weight:600}
/* Bausteine */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin-bottom:12px}
h2{font-size:1.1rem;margin:2px 0 10px}
h3{font-size:.95rem;margin:14px 0 6px;display:flex;align-items:center;gap:6px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:8px 12px;font-weight:600;font-size:.88rem;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.sm2{padding:5px 9px;font-size:.8rem;border-radius:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:11px;padding:8px 10px}
textarea{min-height:88px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--acc);outline-offset:0;border-color:transparent}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:4px 11px;font-size:.82rem}
.chip.on{background:var(--soft);border-color:var(--acc);font-weight:700}
.chip.add{border-style:dashed}
.badge{display:inline-flex;align-items:center;gap:3px;border-radius:99px;padding:2px 9px;font-size:.76rem;font-weight:700;background:var(--soft)}
.badge.ok{background:#2f9e6b22;color:var(--ok)}.badge.part{background:#d99a1d22;color:var(--warn)}.badge.early,.badge.late{background:#c43d5222;color:var(--bad)}
/* Kennzahlen */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--sh)}
.kpi .i{font-size:1.4rem}.kpi b{display:block;font-size:1.2rem;line-height:1.2}.kpi span{font-size:.76rem;color:var(--mut)}
/* Band */
.ribbon{display:flex;gap:3px;margin:0 0 14px;height:62px}
.ribbon div{border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:.78rem;min-width:30px;overflow:hidden;cursor:pointer;text-shadow:0 1px 3px #0006}
.ribbon div i{font-style:normal;font-size:1.25rem;line-height:1.1}
/* Zielkarten */
.sc{display:flex;background:var(--card);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;cursor:pointer;border:2px solid transparent}
.sc.act{border-color:var(--acc)}
.sc .hero{width:84px;flex:none;display:grid;place-items:center;font-size:2rem;position:relative;background-size:cover;background-position:center}
.sc .hero b{position:absolute;top:6px;left:6px;background:#23284acc;color:#fff;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:.78rem;padding:0 5px}
.sc .sb{padding:10px 12px;flex:1;min-width:0}
.sc .sb strong{display:block;font-size:1.02rem}
.sc .go{align-self:center;padding-right:10px;color:var(--mut);font-size:1.4rem}
.leg{margin:5px 0 5px 30px;padding-left:12px;border-left:3px dotted var(--acc);font-size:.8rem;color:var(--mut);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.leg a{font-weight:600}
/* Zieldetail */
.back{border:0;background:none;color:var(--acc);font-weight:700;padding:0 0 8px;font-size:.92rem}
.hh{border-radius:var(--r);min-height:132px;padding:12px 14px;color:#fff;position:relative;display:flex;flex-direction:column;justify-content:flex-end;background-size:cover;background-position:center;overflow:hidden;margin-bottom:10px}
.hh::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0000 30%,#000a)}
.hh>*{position:relative}
.hh .em{position:absolute;right:12px;top:6px;font-size:3.4rem;opacity:.95;filter:drop-shadow(0 2px 4px #0005)}
.hh input{background:none;border:0;color:#fff;font-size:1.45rem;font-weight:800;padding:0;width:100%;text-shadow:0 2px 6px #0008}
.hh input:focus{outline:1.5px dashed #fff8}
.hh .sub{font-size:.85rem;text-shadow:0 1px 4px #0008}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.step button{border:0;background:none;width:34px;height:34px;font-size:1.2rem}
.step span{min-width:68px;text-align:center;font-weight:700;font-size:.88rem}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:14px;margin:12px 0}
.tabs button{flex:1;border:0;background:none;border-radius:10px;padding:7px 2px;font-size:.8rem;font-weight:700;color:var(--mut)}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 5px #0002}
.bloom{border-radius:12px;padding:9px 12px;font-size:.88rem;margin-bottom:10px;background:var(--soft)}
.bloom.ok{background:#2f9e6b22}.bloom.part{background:#d99a1d22}.bloom.early,.bloom.late{background:#c43d5222}
.imgs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.imgs div{position:relative;aspect-ratio:1;border-radius:10px;background-size:cover;background-position:center}
.imgs div b{position:absolute;top:3px;right:3px;background:#000a;color:#fff;border-radius:99px;width:22px;height:22px;display:grid;place-items:center;font-size:.8rem;cursor:pointer}
/* Orte */
.srch{display:flex;gap:6px;position:sticky;top:-14px;background:var(--bg);padding:6px 0;z-index:5}
.srch input{flex:1}
.hit{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)}
.hit small{display:block;color:var(--mut)}
.pc{background:var(--card);border-radius:14px;box-shadow:var(--sh);margin-bottom:8px;padding:8px 10px}
.pc.dn .pn{text-decoration:line-through;opacity:.6}
.pc .top{display:flex;align-items:center;gap:8px}
.pc .pic{font-size:1.4rem;width:34px;text-align:center;flex:none}
.pc .pn{border:0;background:none;font-weight:700;padding:3px 0;border-radius:6px}
.pc .ib{border:0;background:var(--soft);border-radius:10px;width:34px;height:34px;flex:none;font-size:1rem}
.pc .ib.on{background:var(--ok);color:#fff}
.pc .more{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);display:grid;gap:7px}
.pc.flash{animation:fl 2s}
@keyframes fl{0%,60%{background:#ffe9a8}100%{background:var(--card)}}
.pl{font-size:.82rem}
/* Kosten */
.it{display:grid;grid-template-columns:58px 1fr 84px 30px;gap:6px;margin-bottom:6px;align-items:center}
.it select{padding:8px 2px}
.x{border:0;background:none;color:var(--mut);font-size:1.3rem}
.bar{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--soft)}
.legend{display:grid;gap:4px;margin-top:8px}
.legend div{display:flex;align-items:center;gap:8px;font-size:.88rem}
.legend i{width:12px;height:12px;border-radius:4px;flex:none}
.legend span{margin-left:auto;font-weight:700}
.donut{display:block;margin:0 auto;width:190px;height:190px}
.donut text{text-anchor:middle;fill:var(--ink)}
/* Blüte */
.tl{position:relative;margin:6px 0 4px}
.tlr{display:grid;grid-template-columns:92px 1fr;gap:6px;align-items:center;margin:5px 0;font-size:.8rem}
.tlr .t{position:relative;height:22px;background:var(--soft);border-radius:7px}
.tlr .t i{position:absolute;top:0;bottom:0;border-radius:7px;font-style:normal}
.tlr .t .b{background:#f6a5b8aa;border:1px solid #e0708f}
.tlr .t .v{background:#2b3a67;top:7px;bottom:7px;border-radius:5px}
.axis{display:grid;grid-template-columns:92px 1fr;font-size:.7rem;color:var(--mut)}
.axis div{position:relative;height:16px}.axis span{position:absolute;transform:translateX(-50%)}
#dayfl{position:absolute;left:50%;top:52px;transform:translateX(-50%);z-index:500;background:#8a3fc7;color:#fff;border-radius:99px;padding:6px 6px 6px 14px;font-size:.82rem;font-weight:700;box-shadow:var(--sh);display:none;align-items:center;gap:8px;max-width:calc(100% - 140px)}
#dayfl.on{display:flex}#dayfl button{border:0;background:#fff3;color:#fff;border-radius:99px;width:26px;height:26px;flex:none}
.cn{width:20px;height:20px;border-radius:50%;background:#8a3fc7;color:#fff;font:800 12px system-ui;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 1px 4px #0006}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.mg .wd{font-size:.7rem;color:var(--mut);text-align:center}
.mc{aspect-ratio:1;border-radius:10px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:.82rem;color:#fff;position:relative;line-height:1.1;text-shadow:0 1px 2px #0005;padding:0}
.mc.off{color:var(--mut);background:none;font-weight:500;text-shadow:none}
.mc i{font-style:normal;font-size:.8rem}
.mc u{position:absolute;top:2px;right:3px;text-decoration:none;background:#23284a;color:#fff;border-radius:99px;font-size:.62rem;min-width:15px;height:15px;display:grid;place-items:center}
.day{background:var(--card);border-radius:14px;box-shadow:var(--sh);padding:10px;margin-bottom:10px}
.day.on{outline:2px solid #8a3fc7}.day.flash{animation:fl 2s}
.dhd{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.dz{min-height:46px;border:2px dashed var(--line);border-radius:12px;padding:6px;display:grid;gap:5px;align-content:start}
.dz.ov{border-color:#8a3fc7;background:#8a3fc71a}
.dc{background:var(--soft);border-radius:10px;padding:5px 8px}
.dc.lift{opacity:.4}.dc.ovc{box-shadow:0 -3px 0 #8a3fc7}
.dr{display:flex;align-items:center;gap:8px}
.dh{touch-action:none;cursor:grab;font-size:1.2rem;padding:4px 6px;color:var(--mut);user-select:none}
.dn{background:#8a3fc7;color:#fff;border-radius:50%;width:20px;height:20px;display:grid;place-items:center;font-size:.72rem;font-weight:800;flex:none}
.dt{flex:1;min-width:0;cursor:pointer;font-weight:600;font-size:.9rem}
.ce{display:flex;gap:6px;margin-top:6px}.ce input,.ce select{flex:1;padding:5px 8px}
.dsum{margin-top:8px}
.ghost{position:fixed;z-index:5000;pointer-events:none;transform:translate(-50%,-120%);background:#8a3fc7;color:#fff;border-radius:12px;padding:6px 12px;font-weight:700;font-size:.85rem;box-shadow:0 6px 18px #0006;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast-x{}
.tlz{position:relative;margin-top:8px;border-radius:10px;background:var(--soft)}
.tlz.ov{outline:2px solid #8a3fc7}
.hl{position:absolute;left:0;right:0;border-top:1px solid var(--line);font-size:.68rem;color:var(--mut);pointer-events:none}
.hl span{position:absolute;left:5px;top:1px}
.tlb{position:absolute;left:46px;right:4px;top:0;bottom:0}
.tb{position:absolute;border-radius:9px;color:#fff;padding:3px 7px 14px;font-size:.76rem;font-weight:700;touch-action:none;cursor:grab;overflow:hidden;box-shadow:0 2px 7px #0004;line-height:1.25;user-select:none}
.tb small{display:block;font-weight:500;opacity:.92}
.tb.tight{outline:2.5px solid #ffd84d}
.tb.mvg{opacity:.85;z-index:5}
.tbh{position:absolute;left:0;right:0;bottom:0;height:16px;cursor:ns-resize;touch-action:none;background:linear-gradient(#0000,#0005)}
.tbh::after{content:"";position:absolute;left:50%;bottom:5px;width:26px;height:3px;border-radius:9px;background:#fffc;transform:translateX(-50%)}
.tr{position:absolute;left:74%;width:25%;white-space:nowrap;border-radius:8px;color:#fff;padding:2px 5px;font-size:.7rem;font-weight:700;overflow:hidden;background:repeating-linear-gradient(45deg,#4f6f8f,#4f6f8f 7px,#6b8bab 7px,#6b8bab 14px);box-shadow:0 1px 4px #0003;line-height:1.2;pointer-events:none}
.tr small{display:block;font-weight:500;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ce{flex-wrap:wrap}.ce label{display:flex;flex-direction:column;font-size:.7rem;color:var(--mut);flex:1;min-width:96px}
.tbx{position:absolute;top:2px;right:5px;cursor:pointer;font-size:1rem;line-height:1;padding:2px}
.pth{width:38px;height:38px;border-radius:10px;object-fit:cover;flex:none}
.ph{display:flex;gap:6px;overflow-x:auto;margin-top:6px;padding-bottom:2px}
.ph div{position:relative;flex:none}
.ph img{height:68px;width:auto;max-width:130px;border-radius:9px;object-fit:cover;cursor:zoom-in;display:block;background:var(--soft);min-width:60px}
.ph b{position:absolute;top:2px;right:2px;background:#000a;color:#fff;border-radius:99px;width:20px;height:20px;display:grid;place-items:center;font-size:.8rem;cursor:pointer}
#lb{position:fixed;inset:0;background:#000d;z-index:6000;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:16px}
#lb.on{display:flex}#lb img{max-width:96vw;max-height:80vh;border-radius:12px}#lb a{color:#fff;font-size:.85rem}
.hero2{background:linear-gradient(135deg,#d9472b,#f08a5d);color:#fff;border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.hero2 .mut{color:#fffc}.hero2 .big{font-size:2rem;font-weight:800;line-height:1.15;margin:4px 0}.hero2 .badge{background:#fff3;color:#fff}
.hrow{display:flex;gap:10px;padding:7px 0;border-top:1px solid var(--line)}.hrow:first-of-type{border-top:0}.ht{width:48px;flex:none;font-weight:800;font-size:.9rem;line-height:1.2}
.bkr{display:flex;gap:8px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.bks{border:0;background:var(--soft);border-radius:10px;width:38px;height:38px;font-size:1.2rem;flex:none}
.bkt{font-weight:700;font-size:.92rem}.bkt.dn2{text-decoration:line-through;opacity:.65}
.bkr input{padding:5px 8px;font-size:.82rem;margin-top:3px}
#doc{position:fixed;inset:0;background:#fff;color:#1d2140;z-index:7000;display:none;flex-direction:column;color-scheme:light}
#doc.on{display:flex}.dbar{display:flex;gap:8px;padding:10px;background:#1d2140;flex-wrap:wrap}.dbar button{border:0;border-radius:10px;padding:8px 14px;font-weight:700;background:#fff;color:#1d2140}
#docb{overflow:auto;flex:1}
@media print{html,body{height:auto!important;overflow:visible!important;background:#fff!important}#top,#app,#toast,#lb,.dbar{display:none!important}#doc{position:static!important;display:block!important;overflow:visible!important}#docb{overflow:visible!important}.dpage{max-width:none!important;padding:0!important}}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#23284aef;color:#fff;padding:9px 16px;border-radius:99px;font-size:.86rem;z-index:3000;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
#toast.on{opacity:1}
.leaflet-popup-content{margin:12px 14px}
@media(min-width:821px){#toast{bottom:30px}}

.dstrip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.dstrip::-webkit-scrollbar{display:none}
.dchip{flex:none;min-width:54px;border:2px solid transparent;border-radius:14px;background:var(--soft);padding:5px 6px;display:flex;flex-direction:column;align-items:center;font-size:.72rem;line-height:1.2;position:relative;color:var(--ink)}
.dchip i{font-style:normal;font-size:1rem}.dchip b{font-size:.78rem}.dchip.on{border-color:var(--c);background:var(--card);box-shadow:0 1px 6px #0003}

async function syCreate(){try{const r=await fetch(JB,{method:'POST',headers:JH,body:JSON.stringify({rg:RG,ts:S.ts||Date.now(),s:syStrip()})});if(!r.ok)throw new Error('HTTP '+r.status);const loc=r.headers.get('Location')||r.headers.get('X-jsonblob');if(!loc)throw new Error('Der Dienst hat keine Adresse zurückgegeben (Browser-Sperre).');SY={id:String(loc).split('/').pop(),rts:S.ts||0,last:Date.now(),auto:true};sySave();DIRTY=false;copy(syLink(),'Gemeinsamer Plan erstellt. Link kopiert: in WhatsApp senden.');renderPanel()}catch(e){toast('Gemeinsamer Plan konnte nicht erstellt werden: '+e.message)}}
async function syPush(silent){if(!SY)return;try{const ts=S.ts||Date.now();const r=await fetch(JB+'/'+SY.id,{method:'PUT',headers:JH,body:JSON.stringify({rg:RG,ts,s:syStrip()})});if(!r.ok)throw new Error('HTTP '+r.status);SY.rts=ts;SY.last=Date.now();sySave();DIRTY=false;if(!silent)toast('Hochgeladen.');if(view==='more')renderPanel()}catch(e){if(!silent)toast('Hochladen fehlgeschlagen: '+e.message)}}
function syApply(rem){inPull=true;try{S=mig(syMerge(rem.s));S.ts=rem.ts;LS.set(KEY(RG),JSON.stringify(S));SY.rts=rem.ts;SY.last=Date.now();sySave();DIRTY=false;curDay=null;sel=-1;openS=false;render()}finally{inPull=false}}
async function syPull(silent){if(!SY)return;try{const r=await fetch(JB+'/'+SY.id,{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);const rem=await r.json();if(!rem||!rem.s||!rem.s.stops)throw new Error('Unerwartete Antwort');
 if(rem.ts>(SY.rts||0)){if(!DIRTY){syApply(rem);if(!silent||true)toast('Neuer Stand von deiner Reisepartnerin geladen.')}else if(confirm('Ihr habt beide geändert.\n\nOK = meinen Stand behalten und hochladen\nAbbrechen = den neuen Stand laden (meine letzten Änderungen gehen verloren)'))syPush();else syApply(rem)}else if(!silent)toast('Schon auf dem neuesten Stand.')}catch(e){if(!silent)toast('Abholen fehlgeschlagen: '+e.message)}}
let pTmr=null;function pushSoon(){if(!SY||SY.auto===false)return;clearTimeout(pTmr);pTmr=setTimeout(()=>syPush(true),4000)}
async function syJoin(id,rg){try{const r=await fetch(JB+'/'+id,{headers:{'Accept':'application/json'}});if(!r.ok)throw new Error('HTTP '+r.status);const rem=await r.json();if(!rem||!rem.s||!rem.s.stops)throw new Error('Unerwartete Antwort');RG=PRE[rem.rg||rg]?(rem.rg||rg):RG;LS.set('jp3-rg',RG);S=mig(rem.s);S.ts=rem.ts;inPull=true;LS.set(KEY(RG),JSON.stringify(S));inPull=false;SY={id,rts:rem.ts,last:Date.now(),auto:true};sySave();DIRTY=false;curDay=null;sel=-1;openS=false;view='home';render();fitAll();toast('Gemeinsamer Plan geladen. Änderungen werden automatisch geteilt.')}catch(e){toast('Gemeinsamer Plan konnte nicht geladen werden: '+e.message)}}
function syCard(){const t=SY&&SY.last?new Date(SY.last).toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'}):'';
 return'<div class="card"><h3 style="margin-top:0">👫 Gemeinsam planen</h3>'+(!SY?'<p class="sm" style="margin:0 0 8px">Erstellt einen gemeinsamen Plan: ihr beide öffnet denselben Link, Änderungen gleichen sich automatisch ab. Fotos bleiben auf dem jeweiligen Gerät.</p><button class="btn pri" data-a="sy-create">Gemeinsamen Plan erstellen</button><p class="mut sm">Hinweis: Der Plan liegt auf dem kostenlosen Dienst jsonblob.com. Jeder, der den Link kennt, kann ihn lesen und ändern. Gebt ihn nur an die Person weiter, mit der ihr plant.</p>':
 '<p class="sm" style="margin:0 0 8px">✅ Verbunden für diese Variante. '+(t?'Zuletzt abgeglichen um '+t+'.':'')+(DIRTY?' <b>Ungesicherte Änderungen.</b>':'')+'</p><div class="row"><button class="btn" data-a="sy-push">⬆️ Hochladen</button><button class="btn" data-a="sy-pull">⬇️ Neuen Stand holen</button><button class="btn" data-a="sy-link">🔗 Link kopieren</button></div><label class="row sm" style="margin-top:8px"><input type="checkbox" data-f="syauto"'+(SY.auto!==false?' checked':'')+' style="width:auto"> Änderungen automatisch hochladen und regelmäßig abholen</label><div class="row" style="margin-top:6px"><button class="btn sm2" data-a="sy-off">Verbindung trennen</button></div><p class="mut sm">Haben beide gleichzeitig geändert, fragt die App, welcher Stand gelten soll. Die Variante ist gemeinsam, andere Varianten bleiben lokal.</p>')+'</div>'}
setInterval(()=>{if(SY&&document.visibilityState==='visible'&&!DIRTY)syPull(true)},30000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SY&&!DIRTY)syPull(true)});

let cmpOpen=false;
/* Start */
(function(){const m=/[#&]p=([^&]+)/.exec(location.hash);if(m){try{const o=JSON.parse(decodeURIComponent(escape(atob(decodeURIComponent(m[1])))));if(o.s&&o.s.stops&&confirm('Geteilten Plan laden? Euer Stand in dieser Variante wird ersetzt.')){RG=PRE[o.rg]?o.rg:RG;LS.set('jp3-rg',RG);S=mig(o.s);save()}}catch(e){}history.replaceState(null,'',location.pathname)}})();
syLoad();(function(){const m=/[#&]j=([^&~]+)(?:~(v\d))?/.exec(location.hash);if(m){history.replaceState(null,'',location.pathname);window.__join=[m[1],m[2]]}})();
initMap();sheet(1);render();fitAll();phAll();renderFlt();if(window.__join)syJoin(window.__join[0],window.__join[1]);else if(SY)syPull(true);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
